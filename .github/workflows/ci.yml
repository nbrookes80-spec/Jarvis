name: CI

# What this gates, and what it deliberately does not.
#
# Gated, because each one is deterministic and was red for a real reason at
# least once:
#   * dependency resolution on every supported Python version -- this is the
#     check that catches a requirement pinned to a URL that has stopped
#     existing, which is exactly how installs broke on Python 3.12+
#   * pluginmanager importable on current setuptools -- it imports
#     pkg_resources, which setuptools dropped in 82.0.0; without
#     jarviscli/pkg_resources_compat.py that stops Jarvis starting at all
#   * the claude plugin actually registering after a real install
#   * lint on the files this workflow's own branch introduced
#
# NOT gated, and why. Both of these are already failing on master, so turning
# them into required checks would make CI permanently red and tell you nothing:
#   * the full unittest suite -- 294 tests, 6 failures and 37 errors, largely
#     third-party APIs that no longer answer
#   * repo-wide lint -- ~1,968 findings under the project's own settings in
#     test.sh
# Fixing either is worthwhile, but it is separate work, not this workflow's job.

on:
  # Only master on push. Branch pushes are covered by pull_request, and listing
  # them here too makes every commit on a branch with an open PR run the whole
  # workflow twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve deps (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # --dry-run resolves and downloads metadata without installing, so a dead
      # URL or an unsatisfiable pin fails here in seconds.
      - name: Resolve installer/requirements-lean.txt
        run: pip install --dry-run --requirement installer/requirements-lean.txt

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linter
        run: python -m pip install --upgrade pip pycodestyle

      # Scoped to files added on this branch. Repo-wide lint is not clean (see
      # the header), so a wider scope would gate nothing and fail everything.
      - name: Lint new sources
        run: |
          pycodestyle --max-line-length=140 \
            --ignore=E722,W503,W504,E128 \
            jarviscli/plugins/claude_agent.py \
            jarviscli/pkg_resources_compat.py \
            jarviscli/gui/*.py \
            jarviscli/launcher.py \
            jarviscli/packages/ai_brain.py \
            jarviscli/packages/geo.py \
            jarviscli/packages/wiki_api.py \
            jarviscli/tests/test_gui_engine.py \
            jarviscli/tests/test_ai_routing.py

      # The launcher runs the directory (python jarviscli), which puts jarviscli/
      # itself on sys.path -- so there is no importable "jarviscli" package at
      # runtime and any such import is a startup crash. One shipped in
      # jarviscli/__main__.py and got as far as a user's machine.
      - name: Guard against jarviscli.* self-imports
        run: |
          if grep -rnE '^[[:space:]]*(from|import)[[:space:]]+jarviscli\.' jarviscli/ --include='*.py'; then
            echo "::error::jarviscli/ is executed as a directory, so a 'jarviscli.' import raises ModuleNotFoundError on startup. Import the sibling instead, e.g. 'from plugins.message import send_join_message'."
            exit 1
          fi

      - name: Check shell script syntax
        run: |
          bash -n bootstrap.sh
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      # The autostart entry is generated, so check it produces a well-formed
      # desktop file with the keys the spec requires, on a runner with no GUI.
      - name: Check the autostart entry generates correctly
        run: |
          ./scripts/install-autostart.sh
          entry="$HOME/.config/autostart/jarvis.desktop"
          test -f "$entry"
          cat "$entry"
          head -1 "$entry" | grep -qx '\[Desktop Entry\]'
          for key in Type Name Exec Terminal; do
            grep -q "^$key=" "$entry" || { echo "::error::missing $key"; exit 1; }
          done
          grep -q '^Exec="\?.*/scripts/jarvis-terminal.sh"\?$' "$entry"
          ./scripts/install-autostart.sh --remove
          test ! -f "$entry"

      - name: Check .mcp.json.example is valid JSON
        run: python -c "import json; json.load(open('.mcp.json.example'))"

  smoke:
    name: Install and load plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exercises the real installer rather than a reimplementation of it,
      # including its apt step. --no-cli because the Claude Code CLI needs an
      # authenticated login that CI does not have.
      - name: Run bootstrap.sh
        run: ./bootstrap.sh --yes --no-cli

      # bootstrap.sh reports problems but intentionally exits 0 so a partial
      # install is still usable, so assert the invariants separately here.
      - name: Assert pluginmanager imports via the compat shim
        working-directory: jarviscli
        run: |
          if ! ../env/bin/python -W error::UserWarning -c 'import pkg_resources_compat, pluginmanager'; then
            echo "::error::pluginmanager failed to import. It needs pkg_resources, which setuptools 82+ no longer ships; jarviscli/pkg_resources_compat.py is meant to cover that."
            exit 1
          fi

      - name: Assert claude_agent_sdk is importable
        run: ./env/bin/python -c 'import claude_agent_sdk'

      - name: Assert the claude plugin registers
        working-directory: jarviscli
        run: |
          ../env/bin/python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from PluginManager import PluginManager

          manager = PluginManager()
          manager.add_directory("plugins")
          names = set(manager.get_plugins())
          count = manager.get_number_plugins_loaded()

          print("plugins loaded: %d" % count)

          missing = [n for n in ("claude", "ai", "ask") if n not in names]
          if missing:
              sys.exit("::error::not registered: %s" % ", ".join(missing))

          # A floor rather than an exact number: the set varies by Python
          # version, because plugins with a broken import are skipped.
          if count < 180:
              sys.exit("::error::only %d plugins loaded, expected >= 180" % count)

          print("claude, ai and ask all registered")
          PY

      # Loading plugins is not the same as starting the program: the import bug
      # above broke the launcher while leaving PluginManager perfectly happy. This
      # step runs the launcher the way a user does. 'exit' is a real Jarvis
      # command, so it reaches the prompt and then quits.
      - name: Assert ./Jarvis-AI starts
        run: |
          if ! printf 'exit\n' | timeout 180 ./Jarvis-AI > jarvis-start.log 2>&1; then
            cat jarvis-start.log
            echo "::error::./Jarvis-AI exited non-zero on startup."
            exit 1
          fi
          cat jarvis-start.log
          grep -q 'plugins loaded' jarvis-start.log || {
            echo "::error::./Jarvis-AI ran but never reported loading plugins."
            exit 1
          }

      # pyproject.toml: the editable install must produce a working command,
      # and must read the dependency lists the installers use.
      - name: Assert pip install -e . gives a working Jarvis-AI
        run: |
          ./env/bin/pip install --no-deps -e .
          printf 'binary 10\nexit\n' | timeout 180 ./env/bin/Jarvis-AI > pip-start.log 2>&1
          grep -qx '1010' pip-start.log || { cat pip-start.log; echo "::error::env/bin/Jarvis-AI did not run a command"; exit 1; }
          ./env/bin/python -c "from importlib.metadata import requires; r = requires('jarvis-ai'); assert any(x.startswith('claude-agent-sdk') for x in r), r"

      # The desktop window's backend (gui/engine.py, gui/voice.py) imports no
      # GTK, so it is tested headless against the real plugin set.
      - name: GUI backend tests
        working-directory: jarviscli
        run: ../env/bin/python -m unittest tests.test_gui_engine tests.test_ai_routing tests.test_forecast tests.test_wiki tests.test_name_day -v

      # --no-models: the ~210 MB of speech models are not needed to prove the
      # installer works, and would make every run slow.
      - name: Install the desktop window
        run: ./scripts/install-gui.sh --yes --no-models

      - name: Assert GUI dependencies import from env/
        run: |
          ./env/bin/python -c '
          import gi
          gi.require_version("Gtk", "4.0"); gi.require_version("Adw", "1")
          from gi.repository import Gtk, Adw
          import faster_whisper, openwakeword, piper, sounddevice
          print("GTK", Gtk.get_major_version(), Gtk.get_minor_version(), "Adw", Adw.get_major_version(), Adw.get_minor_version())
          '

      # Opens the real window on GTK's headless Broadway backend and waits for
      # the plugins to load. Catches GTK/libadwaita API mistakes in gui/app.py
      # that no import check would. There is no audio device on the runner, so
      # the microphone path reports itself unavailable, which is also tested.
      - name: Assert the window opens and reaches ready
        run: |
          sudo apt-get install -y libgtk-4-bin
          gtk4-broadwayd :5 &
          sleep 1
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 timeout 240 ./env/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "jarviscli")
          from gi.repository import GLib
          from gui import app as A
          A.SETTINGS_FILE = "/tmp/jarvis-ci-gui.json"
          A.Settings.DEFAULTS.update(speak_replies=False)
          app = A.JarvisApp()
          result = {}
          def check():
              if not app.ready:
                  return True
              app.window.send("binary 10")
              GLib.timeout_add(3000, finish)
              return False
          def finish():
              child = app.window.messages.get_last_child()
              result["reply"] = child.get_first_child().get_label() if child else None
              app.quit()
              return False
          GLib.timeout_add(250, check)
          GLib.timeout_add_seconds(200, app.quit)
          app.run(["jarvis-gui"])
          print("plugins:", app.engine.plugin_count, "reply:", result.get("reply"))
          if result.get("reply") != "1010":
              sys.exit("::error::window did not show the reply to 'binary 10'")
          PY
